# Tmux Attention Bus - Global bell tracking across sessions
# This creates a "theater line" in the status bar showing sessions with bells

# Bell action: 'other' = alert on bells in other windows, 'any' = all bells, 'none' = no alerts
# Using 'any' to capture bells across ALL sessions, even if they happen in focused windows
# of sessions you're not currently attached to
set -g bell-action any

# Directory for bell tracking
set -g @bell-log-dir "$HOME/.tmux/bells"

# Hook: Capture bell events and persist to JSONL
set-hook -g alert-bell 'run-shell "~/.tmux/scripts/log-bell.sh #{session_name} #{window_index} #{window_name}"'

# Hook: Clear bell when window is selected (viewed)
set-hook -g after-select-window 'run-shell "~/.tmux/scripts/clear-bell.sh #{session_name} #{window_index}"'

# Hook: Clear bell when switching to a different session
set-hook -g client-session-changed 'run-shell "~/.tmux/scripts/clear-bell.sh #{session_name} #{window_index}"'

# Hook: Clear all bells on session switch (optional, comment out if not desired)
# set-hook -g session-changed 'run-shell "rm -f #{@bell-log-dir}/bells.jsonl"'

# Status component: Render bells with icons and counts
# Format: 🔥session(count) 🔥session2(count)
set -g @bell-renderer "jq -r '.session' #{@bell-log-dir}/bells.jsonl 2>/dev/null | sort | uniq -c | awk '{printf \"🔔%s(%s) \", \$2, \$1}'"

# Alternative simpler format (just session names)
# set -g @bell-renderer "jq -r '.session' #{@bell-log-dir}/bells.jsonl 2>/dev/null | sort -u | tr '\\n' ' '"

# Activity tracking (optional - uncomment to also track window activity)
# set-hook -g alert-activity 'run-shell "~/.tmux/scripts/log-activity.sh #{session_name} #{window_index} #{window_name}"'

# Key binding: Jump to most recent belled window
# Using C-z b (prefix + b for bell)
bind-key b run-shell "~/.tmux/scripts/jump-to-bell.sh"
