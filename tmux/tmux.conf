set -g prefix C-z
unbind C-b
bind C-z send-prefix

set -g mouse on
set -g status-position top
set -g set-clipboard on
set -g allow-passthrough on
set -g update-environment "SSH_TTY"
set -g renumber-windows off

# Use tmux-direct so applications inside tmux see 24-bit color capability.
set -g default-terminal 'tmux-direct'

set -ag terminal-overrides ",xterm-256color:Ms=\\E]52;c;%p2%s\\7"
set -ag terminal-overrides ",foot*:Ms=\\E]52;c;%p2%s\\7"

# Enable truecolor passthrough for common terminals in this setup.
set -ga terminal-features ',foot:RGB'
set -ga terminal-features ',foot-direct:RGB'
set -ga terminal-features ',xterm-ghostty:RGB'
set -as terminal-features ',*:clipboard'

bind c new-window -c "#{pane_current_path}"
bind-key p display-popup -B -E -w 100% -h 100% "pj"
unbind-key -T copy-mode M-w
bind-key -T copy-mode M-w send-keys -X copy-selection

bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Status line configuration
set -g status-position top
set -g status on
set -g status-interval 15
set -g status-justify left

# Status left: session name
set -g status-left "[#S] "
set -g status-left-length 20
set -g status-left-style fg=blue

# Status right: Bells, CPU, RAM, Disk
set -g status-right "#(top -bn1 | grep 'Cpu(s)' | awk '{print $2}' | cut -d'%' -f1)%% CPU  #(free | grep Mem | awk '{print $3/$2*100}' | cut -d'.' -f1)%% RAM  #(df -h / | awk 'NR==2 {print $4}') DISK"
set -g status-right-length 80
set -g status-right-style fg=brightblack,bg=default

# Overall status styling
set -g status-style bg=default,fg=default

# Window status styling
set -g window-status-style fg=brightblack,bg=default
set -g window-status-current-style fg=default,bg=default
set -g window-status-activity-style fg=yellow,bg=default

set -g extended-keys on
